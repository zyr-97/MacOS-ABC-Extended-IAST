# Publish a GitHub Release when a version tag (v2.3, v2.4, ...) is pushed.
# The tag must match VERSION in tools/build_and_verify.py.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the layout and check it matches the committed bundle
        run: |
          python3 tools/build_and_verify.py > /dev/null
          git diff --exit-code -- 'ABC-Extended-IAST-*.bundle' verification.json

      - name: Package
        run: python3 tools/make_release.py "$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ABC-Extended-IAST.zip \
            --title "ABC Extended - IAST ${GITHUB_REF_NAME#v}" \
            --notes-file dist/release-notes.md \
            --verify-tag
