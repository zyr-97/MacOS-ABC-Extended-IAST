# Publish a GitHub Release for the version in tools/build_and_verify.py (VERSION).
#
# Runs on every push to main: if release v<VERSION> doesn't exist yet, it is built
# and published, and GitHub creates the tag. If it exists, nothing happens.
# Pushing a tag v<VERSION> by hand, or "Run workflow" in the Actions tab, also works.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version and check for an existing release
        id: version
        run: |
          tag="v$(cd tools && python3 -c 'from build_and_verify import VERSION; print(VERSION)')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the layout and check it matches the committed bundle
        if: steps.version.outputs.exists != 'true'
        run: |
          python3 tools/build_and_verify.py > /dev/null
          git diff --exit-code -- 'ABC-Extended-IAST-*.bundle' verification.json

      - name: Package
        if: steps.version.outputs.exists != 'true'
        run: python3 tools/make_release.py "${{ steps.version.outputs.tag }}"

      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" dist/ABC-Extended-IAST.zip \
            --target "$GITHUB_SHA" \
            --title "ABC Extended - IAST ${tag#v}" \
            --notes-file dist/release-notes.md
